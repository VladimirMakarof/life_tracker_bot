<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Life Tracker Bot</title>
    <!-- Подключаем иконки и стили -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
</head>
<body>
    <header class="gradient-bg">
        <nav>
            <div class="logo">
                <img src="../img/bot-icon.png" alt="Логотип бота" class="logo-img">
                LifeTracker
            </div>
            <button class="burger-menu" aria-label="Открыть меню">&#9776;</button>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="#profile">Профиль</a></li>
                <li><a href="#goals">Цели</a></li>
                <li><a href="#diary">Дневник</a></li>
                <li><button id="logout" class="logout-btn">Выйти</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 
          Вы можете раскомментировать/дополнить блоки "Цели", "Дневник" и т.д.,
          если они тоже нужны.
        -->

        <section id="profile" class="profile-section">
            <div class="profile-section__inner">
              <h2 class="profile-section__title">Ваш профиль</h2>
              <!-- Форма для редактирования данных пользователя -->
              <form id="profileForm" class="profile-section__form">
                <label for="name" class="profile-section__label">Имя:</label>
                <input type="text" id="name" required class="profile-section__input">
          
                <label for="birthdate" class="profile-section__label">Дата рождения:</label>
                <input type="text" id="birthdate" placeholder="ДД.ММ.ГГГГ" class="profile-section__input">
          
                <label for="target_age" class="profile-section__label">Целевой возраст:</label>
                <input type="number" id="target_age" class="profile-section__input">
          
                <label for="language" class="profile-section__label">Язык:</label>
                <select id="language" class="profile-section__input">
                  <option value="en">English</option>
                  <option value="ru">Русский</option>
                </select>
          
                <label for="morning_time" class="profile-section__label">Время утреннего уведомления:</label>
                <input type="text" id="morning_time" placeholder="08:00" class="profile-section__input">
          
                <label for="evening_time" class="profile-section__label">Время вечернего уведомления:</label>
                <input type="text" id="evening_time" placeholder="20:00" class="profile-section__input">
          
                <button type="submit" class="profile-section__button">Сохранить изменения</button>
              </form>

              <!-- Сообщения/ошибки при обновлении профиля -->
              <p id="profileInfo" class="profile-section__message"></p>

              <!-- Кнопка удаления аккаунта -->
              <button id="deleteAccountBtn" class="profile-section__delete-btn">Удалить аккаунт</button>
            </div>
          </section>
          
    </main>

    <footer>
        <div class="footer-content">
            <p>© 2024 LifeTracker. Все права защищены.</p>
        </div>
    </footer>

    <!-- Основной скрипт для функционала дашборда -->
    <script>
      // При загрузке страницы автоматически запрашиваем данные пользователя
      document.addEventListener('DOMContentLoaded', async () => {
        // 1) Проверяем наличие токена
        const token = localStorage.getItem('auth_token');
        if (!token) {
          // Нет токена => не авторизован
          window.location.href = '/?error=' + encodeURIComponent('Пожалуйста, авторизуйтесь');
          return;
        }

        try {
          // 2) Запрашиваем профиль пользователя
          const response = await fetch('/api/user', {
            headers: {
              'Authorization': 'Bearer ' + token
            }
          });
          const data = await response.json();

          if (data.success) {
            // У нас есть объект data.user
            // Заполним поля формы
            document.getElementById('name').value = data.user.name || '';
            document.getElementById('birthdate').value = data.user.birthdate || '';
            document.getElementById('target_age').value = data.user.target_age || '';
            document.getElementById('language').value = data.user.language || 'en';
            document.getElementById('morning_time').value = data.user.morning_time || '08:00';
            document.getElementById('evening_time').value = data.user.evening_time || '20:00';
          } else {
            // Токен просрочен / неверный
            window.location.href = '/?error=' + encodeURIComponent(data.error || 'Ошибка авторизации');
          }
        } catch (error) {
          console.error('Ошибка при получении профиля:', error);
          window.location.href = '/?error=Сетевая ошибка или сервер недоступен';
        }
      });
    </script>

    <!-- Подключаем ваш dashboard.js (если он нужен) -->
    <script src="../js/dashboard.js"></script>
</body>
</html>
